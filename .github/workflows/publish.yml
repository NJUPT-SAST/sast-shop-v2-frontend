name: Publish Images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.app_name }}
    if: >-
      vars.MOBILE_APP_ORIGIN != '' && vars.DESKTOP_APP_ORIGIN != '' &&
      vars.MOBILE_FEISHU_REDIRECT_URI != '' && vars.DESKTOP_FEISHU_REDIRECT_URI != '' &&
      vars.NEXT_PUBLIC_DATA_SOURCE != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: mobile
            app_filter: "@sast-shop/mobile"
            app_port: 3001
            app_origin_var: MOBILE_APP_ORIGIN
            redirect_uri_var: MOBILE_FEISHU_REDIRECT_URI
          - app_name: desktop
            app_filter: "@sast-shop/desktop"
            app_port: 3002
            app_origin_var: DESKTOP_APP_ORIGIN
            redirect_uri_var: DESKTOP_FEISHU_REDIRECT_URI

    steps:
      - name: Resolve source revision
        id: source
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          revision="${WORKFLOW_RUN_SHA:-$GITHUB_SHA}"
          case "$revision" in
            *[!0-9a-f]*|'') echo "Invalid source revision" >&2; exit 1 ;;
          esac
          test "${#revision}" -eq 40
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Validate public build configuration
        env:
          APP_ORIGIN: ${{ vars[matrix.app_origin_var] }}
          FEISHU_REDIRECT_URI: ${{ vars[matrix.redirect_uri_var] }}
          DATA_SOURCE: ${{ vars.NEXT_PUBLIC_DATA_SOURCE }}
          FEISHU_APP_ID: ${{ secrets.NEXT_PUBLIC_FEISHU_APP_ID }}
          FEEDBACK_FORM_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_FORM_URL }}
        run: |
          test -n "$APP_ORIGIN"
          test -n "$FEISHU_APP_ID"
          test -n "$FEISHU_REDIRECT_URI"
          case "$DATA_SOURCE" in
            mock|local) ;;
            remote) echo "NEXT_PUBLIC_DATA_SOURCE=remote is not connected" >&2; exit 1 ;;
            *) echo "NEXT_PUBLIC_DATA_SOURCE must be mock or local" >&2; exit 1 ;;
          esac
          APP_ORIGIN="$APP_ORIGIN" FEEDBACK_FORM_URL="$FEEDBACK_FORM_URL" node -e '
            const appOrigin = new URL(process.env.APP_ORIGIN)
            const redirectUri = new URL(process.env.FEISHU_REDIRECT_URI)
            const allowedFeedbackHosts = ["feishu.cn", "larksuite.com"]
            if (appOrigin.protocol !== "https:" || appOrigin.username || appOrigin.password || appOrigin.pathname !== "/" || appOrigin.search || appOrigin.hash) process.exit(1)
            if (redirectUri.origin !== appOrigin.origin || redirectUri.pathname !== "/" || redirectUri.username || redirectUri.password || redirectUri.search || redirectUri.hash) process.exit(1)
            if (process.env.FEEDBACK_FORM_URL) {
              const feedbackFormUrl = new URL(process.env.FEEDBACK_FORM_URL)
              if (feedbackFormUrl.protocol !== "https:" || feedbackFormUrl.username || feedbackFormUrl.password) process.exit(1)
              if (!allowedFeedbackHosts.some((root) => feedbackFormUrl.hostname === root || feedbackFormUrl.hostname.endsWith(`.${root}`))) process.exit(1)
            }
          '

      - name: Checkout validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/njupt-sast/sast-shop-v2-frontend-${{ matrix.app_name }}
          tags: |
            type=raw,value=sha-${{ steps.source.outputs.revision }}
            type=raw,value=main
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}

      - name: Build and publish AMD64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_NAME=${{ matrix.app_name }}
            APP_FILTER=${{ matrix.app_filter }}
            APP_PORT=${{ matrix.app_port }}
            BUILD_REVISION=${{ steps.source.outputs.revision }}
            NEXT_PUBLIC_DATA_SOURCE=${{ vars.NEXT_PUBLIC_DATA_SOURCE }}
            NEXT_PUBLIC_APP_ORIGIN=${{ vars[matrix.app_origin_var] }}
            NEXT_PUBLIC_FEISHU_APP_ID=${{ secrets.NEXT_PUBLIC_FEISHU_APP_ID }}
            NEXT_PUBLIC_FEISHU_REDIRECT_URI=${{ vars[matrix.redirect_uri_var] }}
            NEXT_PUBLIC_FEEDBACK_FORM_URL=${{ vars.NEXT_PUBLIC_FEEDBACK_FORM_URL }}
          cache-from: type=gha,scope=publish-${{ matrix.app_name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.app_name }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/njupt-sast/sast-shop-v2-frontend-${{ matrix.app_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: publish
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service:
          - mobile
          - desktop
    uses: ./.github/workflows/deploy.yml
    with:
      mode: deploy
      service: ${{ matrix.service }}
      image_tag: sha-${{ github.event.workflow_run.head_sha }}
    secrets: inherit
