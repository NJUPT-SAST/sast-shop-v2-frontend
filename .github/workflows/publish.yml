name: Publish Images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate successful CI revision
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      current: ${{ steps.source.outputs.current }}
    steps:
      - name: Resolve the CI source and current main revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          current_main="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$REVISION" != "$current_main" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publication: this CI revision is no longer the main tip." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.app_name }}
    needs: source
    if: needs.source.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: mobile
            app_filter: "@sast-shop/mobile"
            app_port: 3001
            app_origin_var: MOBILE_APP_ORIGIN
          - app_name: desktop
            app_filter: "@sast-shop/desktop"
            app_port: 3002
            app_origin_var: DESKTOP_APP_ORIGIN

    steps:
      - name: Validate public build configuration
        env:
          APP_ORIGIN: ${{ vars[matrix.app_origin_var] }}
          DATA_SOURCE: ${{ vars.NEXT_PUBLIC_DATA_SOURCE }}
          FEISHU_APP_ID: ${{ secrets.NEXT_PUBLIC_FEISHU_APP_ID }}
          FEEDBACK_FORM_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_FORM_URL }}
        run: |
          test -n "$APP_ORIGIN"
          test -n "$FEISHU_APP_ID"
          test "$DATA_SOURCE" = local || { echo "Production requires NEXT_PUBLIC_DATA_SOURCE=local" >&2; exit 1; }
          APP_ORIGIN="$APP_ORIGIN" FEEDBACK_FORM_URL="$FEEDBACK_FORM_URL" node -e '
            const appOrigin = new URL(process.env.APP_ORIGIN)
            const allowedFeedbackHosts = ["feishu.cn", "larksuite.com"]
            if (appOrigin.protocol !== "https:" || appOrigin.username || appOrigin.password || appOrigin.pathname !== "/" || appOrigin.search || appOrigin.hash) process.exit(1)
            if (process.env.FEEDBACK_FORM_URL) {
              const feedbackFormUrl = new URL(process.env.FEEDBACK_FORM_URL)
              if (feedbackFormUrl.protocol !== "https:" || feedbackFormUrl.username || feedbackFormUrl.password) process.exit(1)
              if (!allowedFeedbackHosts.some((root) => feedbackFormUrl.hostname === root || feedbackFormUrl.hostname.endsWith(`.${root}`))) process.exit(1)
            }
          '

      - name: Checkout validated revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/njupt-sast/sast-shop-v2-frontend-${{ matrix.app_name }}
          tags: |
            type=raw,value=sha-${{ needs.source.outputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.revision }}

      - name: Build and publish server image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_NAME=${{ matrix.app_name }}
            APP_FILTER=${{ matrix.app_filter }}
            APP_PORT=${{ matrix.app_port }}
            BUILD_REVISION=${{ needs.source.outputs.revision }}
            NEXT_PUBLIC_DATA_SOURCE=${{ vars.NEXT_PUBLIC_DATA_SOURCE }}
            NEXT_PUBLIC_APP_ORIGIN=${{ vars[matrix.app_origin_var] }}
            NEXT_PUBLIC_FEISHU_APP_ID=${{ secrets.NEXT_PUBLIC_FEISHU_APP_ID }}
            NEXT_PUBLIC_FEEDBACK_FORM_URL=${{ vars.NEXT_PUBLIC_FEEDBACK_FORM_URL }}
          cache-from: type=gha,scope=publish-${{ matrix.app_name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.app_name }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/njupt-sast/sast-shop-v2-frontend-${{ matrix.app_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy validated frontend images
    needs: [source, publish]
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
      service: both
    secrets: inherit
