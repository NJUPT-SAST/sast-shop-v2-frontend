name: Deploy

on:
  workflow_call:
    inputs:
      revision:
        description: Full source SHA whose CI and image publication succeeded
        required: true
        type: string
      service:
        description: Frontend service to deploy
        default: both
        type: string
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy (both deploys mobile then desktop)
        required: true
        default: both
        type: choice
        options:
          - both
          - mobile
          - desktop
      image_tag:
        description: Previously published sha-<full commit> tag from a successful main CI run
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

# Automatic and manual deployments share one queue. Validate main after entering
# this queue, so an older build that finishes late cannot replace a newer release.
concurrency:
  group: sast-shop-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Verify source ancestry and successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SERVICE: ${{ inputs.service }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$SERVICE" in both|mobile|desktop) ;; *) exit 1 ;; esac
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            revision="${IMAGE_TAG#sha-}"
            test "$IMAGE_TAG" = "sha-$revision"
          else
            revision="$REQUESTED_REVISION"
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

          current_main="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$EVENT_NAME" != workflow_dispatch ] && [ "$revision" != "$current_main" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping automatic deployment: a newer main revision exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Manual rollback is allowed only to a commit still in main's history.
          comparison="$(gh api "repos/$GH_REPO/compare/$revision...$current_main" --jq .status)"
          case "$comparison" in ahead|identical) ;; *) echo "Revision is not in main history" >&2; exit 1 ;; esac

          conclusion="$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$revision" -f branch=main -f event=push -f per_page=1 \
            --jq '.workflow_runs[0].conclusion')"
          test "$conclusion" = success || { echo "The latest main push CI run for this SHA must succeed" >&2; exit 1; }
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Validate SSH configuration
        if: steps.source.outputs.deploy == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_SSH_FINGERPRINT: ${{ secrets.SERVER_SSH_FINGERPRINT }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_SSH_FINGERPRINT"

      - name: Deploy with the restricted server helper
        if: steps.source.outputs.deploy == 'true'
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          SERVICE: ${{ inputs.service }}
          REVISION: ${{ steps.source.outputs.revision }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          envs: SERVICE,REVISION,GHCR_USERNAME,GHCR_READ_TOKEN
          debug: false
          command_timeout: 20m
          script: |
            set -eu
            # ssh-action exports the allowlisted envs with shell-safe quoting.
            # Keep the short-lived token out of argv and deployment output.
            export GHCR_USERNAME GHCR_READ_TOKEN
            test -n "$GHCR_USERNAME"
            test -n "$GHCR_READ_TOKEN"
            trap 'unset GHCR_USERNAME GHCR_READ_TOKEN' EXIT
            case "$SERVICE" in
              both) applications="mobile desktop" ;;
              mobile|desktop) applications="$SERVICE" ;;
              *) exit 1 ;;
            esac
            case "$REVISION" in *[!0-9a-f]*|'') exit 1 ;; esac
            test "${#REVISION}" -eq 40
            for app_name in $applications; do
              image_ref="ghcr.io/njupt-sast/sast-shop-v2-frontend-${app_name}:sha-${REVISION}"
              python3 -c 'import json, os, sys; json.dump({"registry": "ghcr.io", "username": os.environ["GHCR_USERNAME"], "password": os.environ["GHCR_READ_TOKEN"]}, sys.stdout)' |
                sudo -n /usr/local/lib/sast-shop/deploy-image "$app_name" "$REVISION" "$image_ref" --registry-stdin
            done

      - name: Record deployment
        if: steps.source.outputs.deploy == 'true'
        env:
          REVISION: ${{ steps.source.outputs.revision }}
          SERVICE: ${{ inputs.service }}
        run: |
          printf 'Deployed `%s` from `%s` using the server deployment helper.\n' "$SERVICE" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
