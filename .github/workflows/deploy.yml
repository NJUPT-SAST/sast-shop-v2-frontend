name: Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: choice
        options:
          - mobile
          - desktop
      image_tag:
        description: GHCR tag produced by Publish Images, such as sha-<commit>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Validate deployment request
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          revision="${IMAGE_TAG#sha-}"
          test "$IMAGE_TAG" = "sha-$revision"
          test "${#revision}" -eq 40
          case "$revision" in
            *[!0-9a-f]*) echo "Deploy an immutable sha-<full commit> image tag" >&2; exit 1 ;;
          esac

      - name: Deploy immutable image
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_NAME: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets[inputs.service == 'mobile' && 'MOBILE_SERVER_USER' || 'DESKTOP_SERVER_USER'] }}
          key: ${{ secrets[inputs.service == 'mobile' && 'MOBILE_SSH_PRIVATE_KEY' || 'DESKTOP_SSH_PRIVATE_KEY'] }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          envs: APP_NAME,IMAGE_TAG,GHCR_USERNAME,GHCR_READ_TOKEN
          script: |
            set -eu

            case "$APP_NAME" in
              mobile)
                service_name=sast-shop-mobile
                service_port=3001
                data_dir=/data/sast-shop-mobile
                ;;
              desktop)
                service_name=sast-shop-desktop
                service_port=3002
                data_dir=/data/sast-shop-desktop
                ;;
              *) exit 1 ;;
            esac

            remote_image="ghcr.io/njupt-sast/sast-shop-v2-frontend-${APP_NAME}:${IMAGE_TAG}"
            local_image="sast/${service_name}"

            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            cd "$data_dir"
            test -f docker-compose.yml
            test -f .env
            docker compose config --quiet
            docker pull "$remote_image"

            expected_revision="${IMAGE_TAG#sha-}"
            actual_revision="$(docker image inspect "$remote_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test "$actual_revision" = "$expected_revision"

            if docker image inspect "$local_image:current" >/dev/null 2>&1; then
              docker image tag "$local_image:current" "$local_image:backup"
            fi

            rollback() {
              if docker image inspect "$local_image:backup" >/dev/null 2>&1; then
                docker image tag "$local_image:backup" "$local_image:current"
                if ! docker compose up -d --remove-orphans --force-recreate; then
                  echo "Automatic rollback could not restart the previous image" >&2
                  return 1
                fi
                rollback_attempt=1
                while [ "$rollback_attempt" -le 30 ]; do
                  if curl --fail --silent --show-error "http://127.0.0.1:${service_port}/api/health/ready" >/dev/null; then
                    return 0
                  fi
                  rollback_attempt=$((rollback_attempt + 1))
                  sleep 2
                done
              fi
              echo "Automatic rollback did not restore a ready service" >&2
              return 1
            }

            docker image tag "$remote_image" "$local_image:current"
            if ! docker compose up -d --remove-orphans --force-recreate; then
              docker compose logs --tail=100 || true
              rollback || true
              exit 1
            fi

            ready=false
            attempt=1
            while [ "$attempt" -le 30 ]; do
              if curl --fail --silent --show-error "http://127.0.0.1:${service_port}/api/health/ready" >/dev/null; then
                ready=true
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done

            if [ "$ready" != true ]; then
              docker compose logs --tail=100 || true
              rollback || true
              exit 1
            fi

            deployed_digest="$(docker image inspect "$remote_image" --format '{{index .RepoDigests 0}}')"
            printf '%s %s %s\n' "$(date -u +%FT%TZ)" "$IMAGE_TAG" "$deployed_digest" > deployment-current.txt
