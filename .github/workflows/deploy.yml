name: Deploy

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      service:
        required: true
        type: string
      image_tag:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnose server state or deploy an image
        required: true
        default: diagnostic
        type: choice
        options:
          - diagnostic
          - deploy
      service:
        description: Service to deploy
        required: true
        type: choice
        options:
          - mobile
          - desktop
      image_tag:
        description: GHCR tag produced by Publish Images, such as sha-<commit>
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.mode }} ${{ inputs.service }} on production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_SSH_HOST: ${{ secrets.SERVER_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_MODE: ${{ inputs.mode }}
      DEPLOY_SSH_FINGERPRINT: ${{ secrets.SERVER_SSH_FINGERPRINT }}
      GHCR_USERNAME: ${{ secrets.GHCR_READ_TOKEN != '' && secrets.GHCR_USERNAME || github.actor }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
      GHCR_USING_CUSTOM_TOKEN: ${{ secrets.GHCR_READ_TOKEN != '' }}
      GHCR_CUSTOM_USERNAME: ${{ secrets.GHCR_USERNAME }}

    steps:
      - name: Validate deployment request
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          APP_NAME: ${{ inputs.service }}
        run: |
          case "$DEPLOY_MODE" in
            diagnostic) ;;
            deploy)
              revision="${IMAGE_TAG#sha-}"
              test "$IMAGE_TAG" = "sha-$revision"
              test "${#revision}" -eq 40
              case "$revision" in
                *[!0-9a-f]*) echo "Deploy an immutable sha-<full commit> image tag" >&2; exit 1 ;;
              esac
              ;;
            *) echo "Unknown deployment mode" >&2; exit 1 ;;
          esac

          case "$APP_NAME" in
            mobile|desktop) ;;
            *) echo "Unknown frontend service" >&2; exit 1 ;;
          esac

          test -n "$DEPLOY_SSH_HOST" || { echo "SERVER_HOST is required" >&2; exit 1; }
          test -n "$DEPLOY_SSH_USER" || { echo "SERVER_USER is required" >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "SSH_PRIVATE_KEY is required" >&2; exit 1; }
          if ! [[ "$DEPLOY_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo "SERVER_SSH_FINGERPRINT must be a verified SHA256 host key fingerprint" >&2
            exit 1
          fi
          if [ "$DEPLOY_MODE" = deploy ] && [ "$GHCR_USING_CUSTOM_TOKEN" = true ] && [ -z "$GHCR_CUSTOM_USERNAME" ]; then
            echo "GHCR_USERNAME is required when GHCR_READ_TOKEN is configured" >&2
            exit 1
          fi

      - name: Check automatic deployment revision
        id: revision
        if: github.event_name == 'workflow_run' && inputs.mode == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          latest_revision="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest_revision" = "${IMAGE_TAG#sha-}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skip superseded automatic deployment: $IMAGE_TAG (main is $latest_revision)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run server diagnostics or deploy immutable image
        if: steps.revision.outputs.current != 'false'
        env:
          APP_NAME: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT

          ssh-keyscan -T 10 -t ed25519 -- "$DEPLOY_SSH_HOST" > "$ssh_dir/known_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$ssh_dir/known_hosts" -E sha256 | awk '{print $2}')"
          if [ "$actual_fingerprint" != "$DEPLOY_SSH_FINGERPRINT" ]; then
            echo "Server ED25519 host key does not match SERVER_SSH_FINGERPRINT" >&2
            exit 1
          fi

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          ssh_options=(
            -F /dev/null
            -i "$ssh_dir/key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o IdentityAgent=none
            -o HostKeyAlgorithms=ssh-ed25519
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o UpdateHostKeys=no
            -o ConnectTimeout=30
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
            -l "$DEPLOY_SSH_USER" -- "$DEPLOY_SSH_HOST"
          )

          if [ "$DEPLOY_MODE" = diagnostic ]; then
            cat <<'DIAGNOSTIC_SCRIPT' | timeout 10m ssh "${ssh_options[@]}" 'sh -se'
          set -eu

          printf '\nDeployment identity\n'
          id

          printf '\nAllowed sudo commands\n'
          sudo -n -l 2>&1 || true

          printf '\nDeployment path permissions\n'
          for path in /data/sast-shop-mobile /data/sast-shop-desktop /usr/local/lib/sast-shop/deploy-image; do
            namei -l "$path" 2>&1 || true
          done

          printf '\nDeployment helper usage\n'
          helper=/usr/local/lib/sast-shop/deploy-image
          if [ -r "$helper" ]; then
            stat -c '%A %U %G %s bytes' "$helper" 2>&1 || true
            if [ "$(head -c 2 "$helper")" = '#!' ]; then
              awk '/[Uu][Ss][Aa][Gg][Ee]/ { print NR ": " $0; if (++count == 20) exit }' "$helper"
            else
              echo "Helper is not a readable script; usage was not extracted"
            fi
          else
            echo "Deployment helper is absent or inaccessible"
          fi

          printf '\nShop containers and Compose metadata\n'
          if docker ps --filter name=sast-shop --format '{{.Names}} | {{.Image}} | {{.Ports}}'; then
            for app in mobile desktop; do
              containers="$(docker ps -aq --filter "name=sast-shop-$app")"
              for container in $containers; do
                docker inspect --format '{{.Name}} | project={{index .Config.Labels "com.docker.compose.project"}} | working_dir={{index .Config.Labels "com.docker.compose.project.working_dir"}} | config_files={{index .Config.Labels "com.docker.compose.project.config_files"}} | ports={{json .NetworkSettings.Ports}}' "$container" 2>&1 || true
              done
            done
          fi

          printf '\nImage optimizer diagnostics\n'
          for app in mobile desktop; do
            container="sast-shop-$app"
            docker inspect --format '{{.Name}} | revision={{index .Config.Labels "org.opencontainers.image.revision"}} | extra_hosts={{json .HostConfig.ExtraHosts}}' "$container" 2>&1 || true
            printf '%s DNS lookup:\n' "$container"
            docker exec "$container" node -e '
              const dns = require("node:dns");
              dns.lookup("api.sast.fun", { all: true, hints: dns.ADDRCONFIG }, (error, addresses) => {
                console.log(JSON.stringify({ hostname: "api.sast.fun", addresses, error: error?.code }));
              });
            ' 2>&1 || true
            printf '%s image address rejections:\n' "$container"
            docker logs --tail 200 "$container" 2>&1 | awk 'match($0, /hostname resolved to private IP/) { print substr($0, RSTART) }' || true
          done

          printf '\nCandidate frontend readiness ports\n'
          for port in 3001 3002 23001 23002; do
            printf '%s: ' "$port"
            curl --max-time 5 --silent --show-error --output /dev/null --write-out '%{http_code}\n' "http://127.0.0.1:$port/api/health/ready" || true
          done
          DIAGNOSTIC_SCRIPT
          else
            revision="${IMAGE_TAG#sha-}"
            remote_image="ghcr.io/njupt-sast/sast-shop-v2-frontend-${APP_NAME}:${IMAGE_TAG}"
            registry_payload="$(node -e '
              const credentials = {
                registry: "ghcr.io",
                username: process.env.GHCR_USERNAME,
                password: process.env.GHCR_READ_TOKEN,
              };
              if (Object.values(credentials).some((value) => typeof value !== "string" || !value.trim() || /[\r\n\0]/.test(value))) {
                console.error("Registry credentials must be nonempty strings without line breaks");
                process.exit(1);
              }
              const payload = JSON.stringify(credentials);
              if (Buffer.byteLength(payload) > 16 * 1024) {
                console.error("Registry credentials exceed the helper stdin limit");
                process.exit(1);
              }
              process.stdout.write(payload);
            ')"
            remote_command="sudo -n /usr/local/lib/sast-shop/deploy-image $APP_NAME $revision $remote_image --registry-stdin"
            printf '%s' "$registry_payload" | timeout 10m ssh "${ssh_options[@]}" "$remote_command"
          fi
