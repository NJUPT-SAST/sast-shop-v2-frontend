name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@11.5.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated proto
        run: |
          pnpm proto:generate
          status="$(git status --porcelain -- buf.gen.yaml packages/api/src/gen)"
          test -z "$status" || { echo "$status"; exit 1; }

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Guard fonts and raw colors
        run: |
          ! rg "next/font/google|fonts.googleapis.com|fonts.gstatic.com|letter-spacing|bg-blue-|text-blue-|bg-red-|text-red-" apps packages
