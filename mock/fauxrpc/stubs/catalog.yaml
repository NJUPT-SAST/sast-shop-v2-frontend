    cel_content: |
      {
        'product_template': {
          'id': req.product_template.id,
          'title': req.product_template.title,
          'description': req.product_template.description,
          'price_cents': req.product_template.price_cents,
          'store_id': req.product_template.store_id != 0 ? req.product_template.store_id : (req.product_template.id == 4010 ? 3002 : 3001),
          'category_id': has(req.product_template.category_id) ? req.product_template.category_id : (req.product_template.id == 4010 ? 7102 : 7002),
          'main_image_url': req.product_template.main_image_url,
          'barcode': req.product_template.barcode,
