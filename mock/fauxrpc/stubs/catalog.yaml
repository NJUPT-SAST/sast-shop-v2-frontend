  - id: catalog-create-product-template
    target: sast.sastshopv2.catalog.v1.ProductTemplateService/CreateProductTemplate
    cel_content: |
      {
        'product_template': {
          'id': 4099,
          'title': req.title,
          'description': req.description,
          'price_cents': req.price_cents,
          'store_id': req.store_id,
          'main_image_url': req.main_image_url,
          'barcode': req.barcode,
          'updated_at': now
        }
      }

  - id: catalog-update-product-template
    target: sast.sastshopv2.catalog.v1.ProductTemplateService/UpdateProductTemplate
    cel_content: |
      {
        'product_template': {
          'id': req.product_template.id,
          'title': req.product_template.title,
          'description': req.product_template.description,
          'price_cents': req.product_template.price_cents,
          'store_id': req.product_template.store_id,
          'main_image_url': req.product_template.main_image_url,
          'barcode': req.product_template.barcode,
          'updated_at': now
        }
      }
